<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">铁甲回廊 Iron Corridor — 坦克地牢 Roguelike</title>
  <desc id="desc">深色像素风标题：铁甲回廊，副标题深入回廊，越打越强；右侧是砖墙回廊战场，绿色玩家坦克向红色敌坦克开火，HUD 显示 STAGE 1、WAVE 1/3、SCRAP 18。</desc>

  <rect width="1200" height="360" rx="26" fill="#101018"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#8fa3b4">坦克地牢 ROGUELIKE · PHASER 3 + TYPESCRIPT</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#fcd424">铁甲回廊</text>
    <text x="56" y="168" font-size="23" fill="#e8ecf4">IRON CORRIDOR — 深入回廊，越打越强</text>
    <text x="56" y="204" font-size="19" fill="#aab6cc">程序化地牢，三选一强化，废料永久升级。</text>
    <g id="chips" font-size="18" fill="#e8ecf4" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#1d1d28" stroke="#3a3f4a" stroke-width="1.5"/><text x="119" y="262">30 层深潜</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#1d1d28" stroke="#3a3f4a" stroke-width="1.5"/><text x="257" y="262">25 种强化</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#1d1d28" stroke="#3a3f4a" stroke-width="1.5"/><text x="395" y="262">8 种敌人</text></g>
      <g><rect x="470" y="238" width="168" height="36" rx="18" fill="#1d1d28" stroke="#3a3f4a" stroke-width="1.5"/><text x="554" y="262">每 5 层 Boss</text></g>
    </g>
    <text x="56" y="318" font-size="18" fill="#8fa3b4">WASD 驾驶 · 鼠标瞄准 · 冲刺带无敌帧</text>
  </g>

  <g id="corridor-scene" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="760" y="40" font-size="18" fill="#fcd424">STAGE 1 · WAVE 1 / 3 · SCRAP 18</text>
    <g id="frame">
      <rect x="760" y="56" width="384" height="248" fill="#000000" stroke="#3a3f4a" stroke-width="3"/>
    </g>
    <g id="brick-top" fill="#a82400">
      <rect x="760" y="56" width="48" height="24"/><rect x="808" y="56" width="48" height="24"/>
      <rect x="856" y="56" width="48" height="24"/><rect x="904" y="56" width="48" height="24"/>
      <rect x="952" y="56" width="48" height="24"/><rect x="1000" y="56" width="48" height="24"/>
      <rect x="1048" y="56" width="48" height="24"/><rect x="1096" y="56" width="48" height="24"/>
    </g>
    <g id="brick-top-row2" fill="#8f1e00">
      <rect x="784" y="80" width="48" height="12"/><rect x="832" y="80" width="48" height="12"/>
      <rect x="880" y="80" width="48" height="12"/><rect x="928" y="80" width="48" height="12"/>
      <rect x="976" y="80" width="48" height="12"/><rect x="1024" y="80" width="48" height="12"/>
      <rect x="1072" y="80" width="48" height="12"/>
    </g>
    <g id="steel-sides" fill="#7c7c7c">
      <rect x="760" y="92" width="24" height="48"/><rect x="760" y="152" width="24" height="48"/>
      <rect x="760" y="212" width="24" height="48"/><rect x="760" y="272" width="24" height="32"/>
      <rect x="1120" y="92" width="24" height="48"/><rect x="1120" y="152" width="24" height="48"/>
      <rect x="1120" y="212" width="24" height="48"/><rect x="1120" y="272" width="24" height="32"/>
    </g>
    <g id="steel-detail" fill="#555555">
      <rect x="766" y="104" width="12" height="12"/><rect x="766" y="164" width="12" height="12"/>
      <rect x="766" y="224" width="12" height="12"/><rect x="1126" y="104" width="12" height="12"/>
      <rect x="1126" y="164" width="12" height="12"/><rect x="1126" y="224" width="12" height="12"/>
    </g>
    <g id="brick-floor" fill="#a82400">
      <rect x="784" y="280" width="48" height="24"/><rect x="832" y="280" width="48" height="24"/>
      <rect x="880" y="280" width="48" height="24"/><rect x="928" y="280" width="48" height="24"/>
      <rect x="976" y="280" width="48" height="24"/><rect x="1024" y="280" width="48" height="24"/>
      <rect x="1072" y="280" width="48" height="24"/>
    </g>
    <g id="crate">
      <rect x="1000" y="228" width="28" height="28" fill="#b08954" stroke="#6b4f2a" stroke-width="2"/>
      <rect x="1000" y="228" width="28" height="6" fill="#8a6a3a"/>
      <rect x="1012" y="228" width="4" height="28" fill="#8a6a3a"/>
    </g>
    <g id="tank-player" transform="translate(856 218)">
      <rect x="-34" y="-24" width="68" height="48" rx="4" fill="#2f9e2e"/>
      <rect x="-28" y="-18" width="56" height="36" rx="3" fill="#58d854"/>
      <rect x="14" y="-4" width="34" height="8" fill="#1d1d28"/>
      <circle cx="0" cy="0" r="13" fill="#3cb53b" stroke="#1d1d28" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#1d1d28"/>
      <rect x="-34" y="-28" width="10" height="56" fill="#1d1d28"/>
      <rect x="24" y="-28" width="10" height="56" fill="#1d1d28"/>
    </g>
    <g id="tank-enemy" transform="translate(1052 128)">
      <rect x="-34" y="-24" width="68" height="48" rx="4" fill="#b23a12"/>
      <rect x="-28" y="-18" width="56" height="36" rx="3" fill="#e45820"/>
      <rect x="-48" y="-4" width="34" height="8" fill="#1d1d28"/>
      <circle cx="0" cy="0" r="13" fill="#c94a1a" stroke="#1d1d28" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#1d1d28"/>
      <rect x="-34" y="-28" width="10" height="56" fill="#1d1d28"/>
      <rect x="24" y="-28" width="10" height="56" fill="#1d1d28"/>
    </g>
    <g id="bullets" fill="#fcd424">
      <circle cx="930" cy="196" r="5"/>
      <circle cx="962" cy="180" r="5"/>
      <circle cx="994" cy="164" r="5"/>
    </g>
    <g id="explosion" transform="translate(1010 152)">
      <polygon points="0,-18 5,-5 18,-6 8,3 12,16 0,9 -12,16 -8,3 -18,-6 -5,-5" fill="#fcd424"/>
      <circle r="5" fill="#ffffff"/>
    </g>
    <g id="scrap" font-size="18" fill="#fcd424">
      <text x="800" y="272">废料 +3</text>
    </g>
  </g>
</svg>
